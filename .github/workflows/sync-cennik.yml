name: Synchronizuj cennik z arkusza

on:
  repository_dispatch:
    types: [sync-cennik]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: pip install -r scripts/cennik-sync/requirements.txt

      - name: Zapisz dane serwisowe Google
        run: |
          mkdir -p .secrets
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Uruchom synchronizację
        run: python3 scripts/cennik-sync/apply_sync_all.py --write --report-to-sheet

      - name: Commituj i wypchnij zmiany (jeśli są)
        run: |
          git config user.name "cennik-sync-bot"
          git config user.email "cennik-sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak zmian do zacommitowania."
          else
            git commit -m "Synchronizacja cennika z arkusza Google (automatyczna)"
            git push
          fi

      - name: Wyczyść dane serwisowe
        if: always()
        run: rm -f .secrets/google-service-account.json
